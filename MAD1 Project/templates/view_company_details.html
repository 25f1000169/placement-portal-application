<!DOCTYPE html>
<html lang="en">
<head>
    <title>view company details</title>
    
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .container {
            max-width: 600px;
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
        }
        .list-group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas">
            <nav class="navbar bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand">{{company.name}}</a>
                    <div>
                        <a href="/student/{{student.id}}" class="link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover">Dashboard</a>
                        |
                        <a href="/logout" class="link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover">Logout</a>
                    </div>
                </div>
            </nav>

            <h4 class="mt-5">Overview</h4>
            <p>{{company.about}}</p>

            <div class="mt-4">
                <h3>Current Drives</h3>
                <table class="table table-hover border text-center mt-2">
                    <thead>
                        <tr>
                            <th>Sr No.</th>
                            <th>Drive Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for curr_drive in current_drives %}
                        <tr>
                            <td>{{curr_drive.id}}</td>
                            <td>{{curr_drive.drive_name}}</td>
                            <td>
                                <div class="d-grid gap-2 d-md-block text-center">
                                    <a class="btn btn-outline-primary" href="/apply_current_drive/{{curr_drive.id}}/{{student.id}}">View Details</a>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</body>
</html>
