<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Drive</title>
    
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <form action="/create_drive/{{company_id}}" method="POST">
                    <h2>Create a Drive</h2>
                    <div class="mb-3">
                        <label for="drive_name" class="form-label">Drive Name</label>
                        <input type="text" class="form-control" id="drive_name" name="drive_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="job_title" class="form-label">Job Title</label>
                        <input type="text" class="form-control" id="job_title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="job_description" class="form-label">Job Description</label>
                        <input type="text" class="form-control" id="job_description" name="description" required>
                    </div>
                    <div class="mb-3">
                        <label for="eligibilty_criteria" class="form-label">Eligibilty Criteria</label>
                        <input type="text" class="form-control" id="eligibilty_criteria" name="eligibility" required>
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" required>
                    </div>
                    <div class="mb-3">
                        <label for="salary" class="form-label">Salary</label>
                        <input type="number" class="form-control" id="salary" name="salary" required>
                    </div>
                    <div class="mb-3">
                        <label for="mode" class="form-label">Mode</label>
                        <input type="text" class="form-control" id="mode" name="mode" required>
                    </div>
                    <div class="mb-3">
                        <label for="application_deadline" class="form-label">Application Deadline</label>
                        <input type="date" class="form-control" id="application_deadline" name="deadline" required>
                    </div>
                    <div class="text-center">
                        <a href="/company/{{company_id}}" class="btn btn-primary">Go Back</a>
                        <input type="submit" class="btn btn-success text-center" value="Save">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
