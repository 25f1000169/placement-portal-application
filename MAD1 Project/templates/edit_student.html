<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <form action="/edit_student/{{student.id}}" method="POST">
                    <h2 class="text-center">Edit Profile</h2>
                    <div class="mb-2">
                        <label class="form-label">Name *</label>
                        <input type="text" class="form-control" name="name" value="{{student.name}}" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Mobile Number</label>
                        <input type="text" class="form-control" name="phone" value="{{student.phone}}">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" name="dept" value="{{student.dept}}">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Year of Study</label>
                        <select class="form-select" name="year">
                            <option value="1" {% if student.year == 1 %}selected{% endif %}>1st Year</option>
                            <option value="2" {% if student.year == 2 %}selected{% endif %}>2nd Year</option>
                            <option value="3" {% if student.year == 3 %}selected{% endif %}>3rd Year</option>
                            <option value="4" {% if student.year == 4 %}selected{% endif %}>4th Year</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">CGPA</label>
                        <input type="number" class="form-control" step="0.01" min="0" max="10" name="cgpa" value="{{student.cgpa}}">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Skills</label>
                        <input type="text" class="form-control" name="skills" value="{{student.skills}}">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Resume Link</label>
                        <input type="url" class="form-control" name="resume" value="{{student.resume}}" placeholder="https://drive.google.com/...">
                    </div>
                    <div class="text-center">
                        <input type="submit" class="btn btn-primary" value="Save Changes">
                        <a href="/student/{{student.id}}" class="btn btn-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
