<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Page</title>
    
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                
                {% if error %}
                    <p style="color: red; background-color: #ffd2d2; padding: 10px; border: 1px solid red;">
                        {{ error }}
                    </p>
                {% endif %}

                <form action="/login" method="POST">
                    <h2 class="text-center">Login</h2>
                    <div class="mb-3">
                        <label>Login As</label>
                        <select name="role" class="form-select">
                            <option value="student">Student</option>
                            <option value="company">Company</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username/email</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="pwd" required>
                    </div>
                    <div class="text-center">
                        <input type="submit" class="btn btn-primary text-center" value="Login">
                        <br>
                        <p class="mb-1">New Student? <a href="/register/student">Register here</a></p>
                        <p class="mb-1">New Company? <a href="/register/company">Register here</a></p>
                    </div>
                </form>

            </div>
        </div>
    </div>
</body>
</html>
